name: Verify video application
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preserve database connections after an orphaned health probe
        run: python3 scripts/check_db_reaping.py
      - name: Run tests on PostgreSQL and FFmpeg
        run: bash scripts/test.sh
      - name: Start application from empty volumes
        run: bash start.sh
      - name: Check real object storage and playback
        run: python3 scripts/smoke.py http://localhost:8000
      - name: Reject unsigned reads from the real object store
        run: docker compose exec -T web python - < scripts/check_storage.py
      - name: Record runtime diagnostics
        if: failure()
        run: docker compose logs --tail 150
      - name: Stop evaluation stack
        if: always()
        run: docker compose down --remove-orphans

