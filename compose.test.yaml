name: stackbridge-test
services:
  db:
    image: postgres:17-bookworm
    # Keep orphaned readiness probes away from PostgreSQL's child reaper.
    init: true
    environment:
      POSTGRES_USER: tests
      POSTGRES_PASSWORD: tests-local-only
      POSTGRES_DB: tests
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tests -d tests"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://tests:tests-local-only@db:5432/tests
    depends_on:
      db: {condition: service_healthy}

