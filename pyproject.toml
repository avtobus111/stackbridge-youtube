[project]
name = "stackbridge-youtube"
version = "1.0.0"
description = "YouTube-style video application for the StackBridge test assignment"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<2.2",
  "psycopg[binary]>=3.2,<4", "boto3>=1.35,<2", "pydantic-settings>=2.7,<3",
  "alembic>=1.14,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "moto[s3]>=5,<6", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.setuptools]
packages = ["backend"]

