name: stackbridge

x-app: &app
  image: stackbridge-video:local
  build:
    context: .
    target: runtime
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://stackbridge:${DB_PASSWORD:?Run start.sh first}@db:5432/stackbridge
    S3_ENDPOINT: http://storage:8333
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Run start.sh first}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?Run start.sh first}
    S3_BUCKET: videos
    DEMO_PASSWORD: ${DEMO_PASSWORD:?Run start.sh first}
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8000}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-536870912}
    AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-20}
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=1200m,mode=1777
  networks:
    - private

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: stackbridge
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run start.sh first}
      POSTGRES_DB: stackbridge
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackbridge -d stackbridge"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [private]

  storage:
    image: chrislusf/seaweedfs:4.44
    restart: unless-stopped
    command: ["server", "-dir=/data", "-ip=storage", "-ip.bind=0.0.0.0", "-s3", "-s3.port=8333", "-s3.port.iceberg=0", "-s3.port.lance=0", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=1024", "-volume.max=5"]
    volumes:
      - object-data:/data
      - ./runtime/s3.json:/etc/seaweedfs/s3.json:ro
    security_opt: [no-new-privileges:true]
    networks: [private]

  initialize:
    <<: *app
    command: ["python", "-m", "backend.initialize"]
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
      storage: {condition: service_started}

  web:
    <<: *app
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    depends_on:
      initialize: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    <<: *app
    command: ["python", "-m", "backend.worker"]
    restart: unless-stopped
    stop_grace_period: 11m
    depends_on:
      initialize: {condition: service_completed_successfully}

volumes:
  postgres-data:
  object-data:

networks:
  private:

